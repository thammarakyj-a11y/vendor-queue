<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>รับคิว — GC Warehouse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f0f4f8;
    color: #1a2a40;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .logo {
    font-size: 12px;
    color: #6b82a0;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: #1a3a6b; }

  /* FORM CARD */
  .card {
    background: white;
    border: 1px solid #d4e0f0;
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 20px rgba(26,58,107,.10);
  }
  .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #1a3a6b; }
  .card-sub { font-size: 14px; color: #6b82a0; margin-bottom: 28px; line-height: 1.6; }

  label { display: block; font-size: 13px; color: #6b82a0; margin-bottom: 8px; font-weight: 500; }
  input[type=text] {
    width: 100%;
    background: #f0f4f8;
    border: 1.5px solid #d4e0f0;
    border-radius: 12px;
    padding: 14px 16px;
    color: #1a2a40;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, background .2s;
    margin-bottom: 20px;
  }
  input[type=text]:focus { border-color: #2563b0; background: white; }
  input[type=text]::placeholder { color: #b0bec5; }

  .btn-submit {
    width: 100%;
    background: #1a3a6b;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .btn-submit:hover { background: #2563b0; }
  .btn-submit:active { transform: scale(.98); }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* TICKET */
  .ticket {
    display: none;
    background: white;
    border: 1px solid #d4e0f0;
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(26,58,107,.10);
  }
  .ticket-label {
    font-size: 12px;
    color: #6b82a0;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .ticket-num {
    font-size: 104px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #1a3a6b, #2563b0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-variant-numeric: tabular-nums;
    margin-bottom: 14px;
  }
  .ticket-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: #1a2a40; }
  .ticket-time { font-size: 13px; color: #6b82a0; margin-bottom: 22px; }

  .ticket-notice {
    background: #e8f0fb;
    border: 1.5px solid #b8d0f0;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 14px;
    color: #1a3a6b;
    line-height: 1.7;
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* screenshot reminder */
  .ticket-screenshot {
    background: #fff7ed;
    border: 1.5px solid #fdba74;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #9a3412;
    line-height: 1.6;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ticket-screenshot .ss-icon { font-size: 22px; flex-shrink: 0; }

  .ticket-waiting {
    font-size: 13px;
    color: #6b82a0;
    margin-bottom: 24px;
    background: #f0f4f8;
    border-radius: 8px;
    padding: 8px 14px;
    display: inline-block;
  }
  .ticket-waiting span { color: #2563b0; font-weight: 700; }

  .btn-new {
    width: 100%;
    background: transparent;
    color: #6b82a0;
    border: 1.5px solid #d4e0f0;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .btn-new:hover { border-color: #2563b0; color: #1a3a6b; }

  .loading { text-align: center; color: #6b82a0; font-size: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #d4e0f0; border-top-color: #2563b0; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .conn-status { font-size: 12px; color: #6b82a0; margin-top: 20px; display: flex; align-items: center; gap: 6px; justify-content: center; }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: #b0bec5; }
  .conn-dot.online { background: #16a34a; box-shadow: 0 0 5px #86efac; }
</style>
</head>
<body>

<div class="logo"><div class="logo-dot"></div>GC Warehouse · Central Receive<div class="logo-dot"></div></div>

<!-- FORM -->
<div class="card" id="form-card">
  <div class="card-title">🎫 รับบัตรคิว</div>
  <div class="card-sub">กรอกชื่อบริษัทเพื่อรับเลขคิว<br>แล้วรอเรียกที่จอแสดงผลหน้า Warehouse</div>
  <label>ชื่อบริษัท / Vendor</label>
  <input type="text" id="inp-company" placeholder="เช่น บริษัท ABC จำกัด" autocomplete="organization">
  <button class="btn-submit" onclick="submitQueue()" id="btn-submit">รับคิว →</button>
</div>

<!-- TICKET -->
<div class="ticket" id="ticket-card">
  <div class="ticket-label">หมายเลขคิวของคุณ</div>
  <div class="ticket-num" id="ticket-num">—</div>
  <div class="ticket-name" id="ticket-name"></div>
  <div class="ticket-time" id="ticket-time"></div>
  <div class="ticket-notice">
    📺 กรุณารอเรียกชื่อที่<br><strong>จอแสดงผลหน้า Warehouse</strong>
  </div>
  <div class="ticket-screenshot">
    <span class="ss-icon">📸</span>
    <span><strong>กรุณาแคปหน้าจอนี้ไว้เป็นหลักฐาน</strong><br>ก่อนออกจากหน้านี้</span>
  </div>
  <div class="ticket-waiting" id="ticket-waiting"></div>
  <button class="btn-new" onclick="resetForm()">← กลับหน้าหลัก</button>
</div>

<div class="conn-status">
  <div class="conn-dot" id="cdot"></div>
  <span id="clabel">กำลังเชื่อมต่อ...</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmFkw8GAHAOQEHzDfaEKIVabs-4t_XhPE",
  authDomain: "central-recevie-queue-mange.firebaseapp.com",
  databaseURL: "https://central-recevie-queue-mange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "central-recevie-queue-mange",
  storageBucket: "central-recevie-queue-mange.firebasestorage.app",
  messagingSenderId: "848748738188",
  appId: "1:848748738188:web:76a0ab8ab6218b07b1ada9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const todayKey = new Date().toISOString().split('T')[0];
const counterRef = db.ref('counter/' + todayKey);
const queueRef = db.ref('queue');

db.ref('.info/connected').on('value', snap => {
  const ok = snap.val();
  document.getElementById('cdot').className = 'conn-dot ' + (ok ? 'online' : '');
  document.getElementById('clabel').textContent = ok ? 'เชื่อมต่อแล้ว' : 'ไม่มีสัญญาณ...';
});

function submitQueue() {
  const name = document.getElementById('inp-company').value.trim();
  if (!name) { document.getElementById('inp-company').focus(); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>กำลังออกบัตรคิว...';

  counterRef.transaction(cur => (cur || 0) + 1, (err, committed, snap) => {
    if (err || !committed) {
      btn.disabled = false;
      btn.textContent = 'รับคิว →';
      alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
      return;
    }
    const n = snap.val();
    // ใช้รูปแบบ 01, 02, ... เหมือน Staff interface
    const num = String(n).padStart(2, '0');
    const id = 'q_' + Date.now();
    const now = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
    const item = {
      id, num, name,
      type: '', gate: '',
      addedBy: 'Vendor (QR)',
      addedAt: Date.now(),
      time: timeStr,
      status: 'waiting'
    };
    queueRef.child(id).set(item, err2 => {
      if (err2) {
        btn.disabled = false;
        btn.textContent = 'รับคิว →';
        alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
        return;
      }
      showTicket(num, name, timeStr);
      updateWaiting(n);
    });
  });
}

function showTicket(num, name, time) {
  document.getElementById('form-card').style.display = 'none';
  document.getElementById('ticket-card').style.display = 'block';
  document.getElementById('ticket-num').textContent = num;
  document.getElementById('ticket-name').textContent = name;
  document.getElementById('ticket-time').textContent = 'เวลา ' + time + ' น.';
}

function updateWaiting(myPos) {
  queueRef.orderByChild('status').equalTo('waiting').once('value', snap => {
    const count = snap.numChildren();
    const ahead = Math.max(0, count - 1);
    const el = document.getElementById('ticket-waiting');
    if (ahead === 0) {
      el.innerHTML = 'คุณอยู่ <span>ถัดไป</span> ในคิว';
    } else {
      el.innerHTML = 'มีคิวรอก่อนหน้า <span>' + ahead + ' คิว</span>';
    }
  });
}

function resetForm() {
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('ticket-card').style.display = 'none';
  document.getElementById('inp-company').value = '';
  const btn = document.getElementById('btn-submit');
  btn.disabled = false;
  btn.textContent = 'รับคิว →';
}

document.getElementById('inp-company').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitQueue();
});
</script>
</body>
</html>
